<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星际躲避球</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d2250, #090b1d 65%);
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: #f6f7ff;
    }
    .wrap { width: min(92vw, 560px); }
    .panel {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      opacity: .9;
    }
    canvas {
      width: 100%;
      height: auto;
      border: 2px solid #6e7dff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(28, 38, 117, .45);
      background: linear-gradient(180deg, #101432, #050714);
    }
    .hint { margin-top: 10px; font-size: 13px; opacity: .82; line-height: 1.5; }
    kbd { background: #1d255a; border: 1px solid #4654cb; border-radius: 4px; padding: 1px 5px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="panel">
      <span>🎮 星际躲避球</span>
      <span id="status">按空格开始</span>
    </div>
    <canvas id="game" width="560" height="720" aria-label="game"></canvas>
    <p class="hint">操作：<kbd>←</kbd><kbd>→</kbd> 移动飞船，<kbd>空格</kbd> 开始/重新开始。坚持越久分数越高！</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const state = {
      running: false,
      over: false,
      t: 0,
      score: 0,
      best: Number(localStorage.getItem('dodge_best') || 0),
      player: { x: canvas.width / 2, y: canvas.height - 70, r: 16, speed: 6 },
      balls: [],
      keys: { left: false, right: false }
    };

    function reset() {
      state.running = true;
      state.over = false;
      state.t = 0;
      state.score = 0;
      state.player.x = canvas.width / 2;
      state.balls = [];
      statusEl.textContent = '存活中...';
    }

    function spawnBall() {
      const r = 8 + Math.random() * 18;
      state.balls.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -r,
        r,
        vy: 2 + Math.random() * 4 + state.t * 0.002,
        vx: (Math.random() - 0.5) * (1.6 + state.t * 0.0008)
      });
    }

    function update() {
      if (!state.running) return;
      state.t += 1;
      if (state.t % Math.max(12, 36 - Math.floor(state.t / 300)) === 0) spawnBall();

      if (state.keys.left) state.player.x -= state.player.speed;
      if (state.keys.right) state.player.x += state.player.speed;
      state.player.x = Math.max(state.player.r, Math.min(canvas.width - state.player.r, state.player.x));

      for (const b of state.balls) {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < b.r || b.x > canvas.width - b.r) b.vx *= -1;
      }
      state.balls = state.balls.filter(b => b.y < canvas.height + b.r);

      for (const b of state.balls) {
        const dx = b.x - state.player.x;
        const dy = b.y - state.player.y;
        if (Math.hypot(dx, dy) < b.r + state.player.r - 2) {
          state.running = false;
          state.over = true;
          state.best = Math.max(state.best, state.score);
          localStorage.setItem('dodge_best', String(state.best));
          statusEl.textContent = `游戏结束：${state.score} 分（最高 ${state.best}）`;
        }
      }

      if (!state.over) state.score = Math.floor(state.t / 6);
    }

    function drawShip() {
      const p = state.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(14, 14);
      ctx.lineTo(0, 8);
      ctx.lineTo(-14, 14);
      ctx.closePath();
      ctx.fillStyle = '#77e8ff';
      ctx.fill();
      ctx.shadowColor = '#77e8ff';
      ctx.shadowBlur = 12;
      ctx.fillRect(-4, 8, 8, 12);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 80; i++) {
        const x = (i * 67 + state.t * 0.6) % canvas.width;
        const y = (i * 91 + state.t * 1.1) % canvas.height;
        ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 5) * 0.12})`;
        ctx.fillRect(x, y, 2, 2);
      }

      drawShip();

      for (const b of state.balls) {
        const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, 2, b.x, b.y, b.r);
        g.addColorStop(0, '#fff');
        g.addColorStop(1, '#ff5ca9');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#f4f6ff';
      ctx.font = 'bold 22px Segoe UI';
      ctx.fillText(`分数 ${state.score}`, 18, 34);
      ctx.font = '14px Segoe UI';
      ctx.fillText(`最高 ${state.best}`, 18, 56);

      if (!state.running && !state.over) {
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px Segoe UI';
        ctx.fillText('星际躲避球', canvas.width / 2, canvas.height / 2 - 15);
        ctx.font = '18px Segoe UI';
        ctx.fillText('按空格开始游戏', canvas.width / 2, canvas.height / 2 + 28);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') state.keys.left = true;
      if (e.code === 'ArrowRight') state.keys.right = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!state.running) reset();
      }
    });
    addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') state.keys.left = false;
      if (e.code === 'ArrowRight') state.keys.right = false;
    });

    render();
    loop();
  </script>
</body>
</html>
